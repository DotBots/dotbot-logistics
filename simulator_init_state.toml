# This file is used to create and configure simulated DotBot instances for the simulator.
# Default init state: 5x5 grid (cell=400mm, map=2000x2000mm).
# Launch with:
#   dotbot run simulator --map-size 2000x2000 --simulator-init-state simulator_init_state.toml
# Pair with: python sim_dotbot_pibt.py            (default --map-cells 5)
# For the 8x8 layout, use simulator_init_state_8x8.toml with --map-cells 8.

[network]
pdr = 100
uplink_pdr = 100
downlink_pdr = 100
slot_duration_ms = 1.236
mqtt_latency_ms = 0.0

# 10 bots — positions = cell centres of the 5x5 grid (cell=400mm, map=2000x2000mm)
# cell (gx, gy) → pos_x = gx*400+200, pos_y = gy*400+200

[[dotbots]]
address = "BADCAFE111111111"    # agent 0 — cell (0,0)
calibrated = 0xff
pos_x = 200
pos_y = 200
direction = 0
network_mode = "default"

[[dotbots]]
address = "DEADBEEF22222222"    # agent 1 — cell (2,1)
calibrated = 0xff
pos_x = 1000
pos_y = 600
direction = 90

