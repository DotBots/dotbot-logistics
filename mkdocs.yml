site_name: DotBot Logistics
site_description: >-
  MRTA mode for a DotBot swarm — click a robot and a point in the console, PIBT drives it
  there collision-free. Install, run, and design docs for the bridge.
repo_url: https://github.com/DotBots/dotbot-logistics
repo_name: DotBots/dotbot-logistics

docs_dir: docs

theme:
  name: material
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - toc.follow
  palette:
    - scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.details

nav:
  - Home: index.md
  - Installation: installation.md
  - Run MRTA mode: run.md
  - How it works: how-it-works.md
  - The console toggle: console-toggle.md
  - Reference: reference.md
  - Contributing: contributing.md
  - Appendix: appendix.md
