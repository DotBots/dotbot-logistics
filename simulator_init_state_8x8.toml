# This file is used to create and configure simulated DotBot instances for the simulator.
# Alternate init state: 8x8 grid (cell=250mm, map=2000x2000mm). Default is the 5x5
# simulator_init_state.toml.
# Launch with:
#   dotbot run simulator --map-size 2000x2000 --simulator-init-state simulator_init_state_8x8.toml
# Pair with: python sim_dotbot_pibt.py --map-cells 8

[network]
pdr = 100
uplink_pdr = 100
downlink_pdr = 100
slot_duration_ms = 1.236
mqtt_latency_ms = 0.0

# 10 bots — positions = cell centres of the 8x8 grid (cell=250mm, map=2000x2000mm)
# cell (gx, gy) → pos_x = gx*250+125, pos_y = gy*250+125

[[dotbots]]
address = "BADCAFE111111111"    # agent 0 — cell (0,0)
calibrated = 0xff
pos_x = 125
pos_y = 125
direction = 0
network_mode = "default"

[[dotbots]]
address = "DEADBEEF22222222"    # agent 1 — cell (2,1)
calibrated = 0xff
pos_x = 625
pos_y = 375
direction = 90

